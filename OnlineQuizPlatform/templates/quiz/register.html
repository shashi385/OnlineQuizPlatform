{% extends 'quiz/base.html' %}
{% block title %}Register | QuizMaster{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1><p class="muted">Register to participate in quizzes.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn full" type="submit">Create Account</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
